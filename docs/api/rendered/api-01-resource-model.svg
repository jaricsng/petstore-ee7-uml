8594"/></g><!--class n1--><g class="entity" data-entity="n1" data-source-line="30" data-uid="ent0008" id="entity_n1"><rect fill="#F7FAFD" height="88.8594" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="448.666" x="1407.5" y="266.2969"/><text fill="#000000" font-family="Helvetica" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="147.2227" x="1558.2217" y="282.4355">&#171;collection, public read&#187;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="78.1006" x="1592.7827" y="298.2607">/categories</text><line style="stroke:#2F5D8A;stroke-width:0.5;" x1="1408.5" x2="1855.166" y1="306.5625" y2="306.5625"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="327.2227" x="1413.5" y="323.5576">GET ?page&amp;size -&gt; CategoryPage + PageMeta</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="436.666" x="1413.5" y="339.8545">POST CategoryCreate [catalogue:write] -&gt; 201 Location, ETag</text><line style="stroke:#2F5D8A;stroke-width:0.5;" x1="1408.5" x2="1855.166" y1="347.1563" y2="347.1563"/></g><!--class n2--><g class="entity" data-entity="n2" data-source-line="34" data-uid="ent0009" id="entity_n2"><rect fill="#F7FAFD" height="105.1563" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="358.0625" x="1053" y="442.2969"/><text fill="#000000" font-family="Helvetica" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="41.9238" x="1211.0693" y="458.4355">&#171;item&#187;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.5195" x="1144.2715" y="474.2607">/categories/{categoryId}</text><line style="stroke:#2F5D8A;stroke-width:0.5;" x1="1054" x2="1410.0625" y1="482.5625" y2="482.5625"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="173.373" x="1059" y="499.5576">GET -