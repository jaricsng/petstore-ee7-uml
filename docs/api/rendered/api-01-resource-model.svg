<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="703px" preserveAspectRatio="none" style="width:2228px;height:703px;background:#FFFFFF;" version="1.1" viewBox="0 0 2228 703" width="2228px" zoomAndPan="magnify"><title>REST interface - resource model: current (/rest) vs proposed (/api/v1)</title><defs/><g><g class="title" data-source-line="9"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="549.1924" x="832.4385" y="22.9951">REST interface - resource model: current (/rest) vs proposed (/api/v1)</text></g><!--cluster cur--><g class="cluster" data-entity="cur" data-source-line="11" data-uid="ent0002" id="cluster_cur"><rect fill="#FFF5F5" height="335" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="1006" x="7" y="44.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="454.7061" x="282.647" y="59.292">Current: /applicationPetstore/rest (Swagger 2.0, no auth)</text></g><!--cluster tgt--><g class="cluster" data-entity="tgt" data-source-line="29" data-uid="ent0007" id="cluster_tgt"><rect fill="#F5FFF7" height="466" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="943" x="1037" y="231.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="381.4111" x="1317.7944" y="246.292">Proposed: /api/v1 (OpenAPI 3.1, OAuth2 scopes)</text></g><!--class c1--><g class="entity" data-entity="c1" data-source-line="12" data-uid="ent0003" id="entity_c1"><rect fill="#F7FAFD" height="88.8594" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="308.8096" x="312.5" y="79.2969"/><text fill="#000000" font-family="Helvetica" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="72.3867" x="430.7114" y="95.4355">&#171;collection&#187;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="78.1006" x="427.8545" y="111.2607">/categories</text><line style="stroke:#2F5D8A;stroke-width:0.5;" x1="313.5" x2="620.3096" y1="119.5625" y2="119.5625"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.8096" x="318.5" y="136.5576">GET ?start&amp;max -&gt; List&lt;Category entity&gt;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.7041" x="318.5" y="152.8545">POST Category entity -&gt; 201 Location</text><line style="stroke:#2F5D8A;stroke-width:0.5;" x1="313.5" x2="620.3096" y1="160.1563" y2="160.1563"/></g><!--class c2--><g class="entity" data-entity="c2" data-source-line="16" data-uid="ent0004" id="entity_c2"><rect fill="#F7FAFD" height="105.1563" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="177.0742" x="378.5" y="258.2969"/><text fill="#000000" font-family="Helvetica" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="41.9238" x="446.0752" y="274.4355">&#171;item&#187;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="113.4082" x="410.333" y="290.2607">/categories/{id}</text><line style="stroke:#2F5D8A;stroke-width:0.5;" x1="379.5" x2="554.5742" y1="298.5625" y2="298.5625"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="120.9893" x="384.5" y="315.5576">GET -&gt; 200 | 404</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="165.0742" x="384.5" y="331.8545">PUT entity -&gt; 204 | 409</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="146.4121" x="384.5" y="348.1514">DELETE -&gt; 204 | 404</text><line style="stroke:#2F5D8A;stroke-width:0.5;" x1="379.5" x2="554.5742" y1="355.4531" y2="355.4531"/></g><!--class c3--><g class="entity" data-entity=