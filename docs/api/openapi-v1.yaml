openapi: 3.1.0
info:
  title: YAPS PetStore API
  version: 1.0.0
  summary: Proposed versioned, DTO-based public API (ADR-0005). Replaces the entity-based /rest/* resources.
  description: |
    Conventions: RFC 9110 HTTP semantics, RFC 9457 problem details for errors, cursorless page/size pagination,
    ETag/If-Match optimistic concurrency, OAuth 2.0 bearer tokens (scopes) from the OIDC provider (ADR-0006).
    Resources shown: categories and items (read, public) and orders (customer-scoped). Other resources follow the same pattern.
  license:
    name: CC BY-SA 3.0
    url: https://creativecommons.org/licenses/by-sa/3.0/
servers:
  - url: https://petstore.example.com/api/v1
tags:
  - name: catalogue
  - name: orders
security:
  - oauth2: []
paths:
  /categories:
    get:
      tags: [catalogue]
      operationId: listCategories
      summary: List categories
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [catalogue]
      operationId: createCategory
      summary: Create a category (administrators only)
      security:
        - oauth2: [catalogue:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [catalogue]
      operationId: getCategory
      security: []
      responses:
        '200':
          description: The category
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [catalogue]
      operationId: replaceCategory
      security:
        - oauth2: [catalogue:write]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [catalogue]
      operationId: deleteCategory
      security:
        - oauth2: [catalogue:write]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /items:
    get:
      tags: [catalogue]
      operationId: searchItems
      summary: Search items by keyword (replaces the JSF search)
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemPage'
  /me/orders:
    get:
      tags: [orders]
      operationId: listMyOrders
      summary: Orders of the authenticated customer (prevents BOLA - OWASP API1:2023)
      security:
        - oauth2: [orders:read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [orders]
      operationId: placeOrder
      summary: Place an order from cart lines; payment by PSP token (ADR-0007)
      security:
        - oauth2: [orders:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order placed
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '402': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://idp.example.com/realms/petstore/protocol/openid-connect/auth
          tokenUrl: https://idp.example.com/realms/petstore/protocol/openid-connect/token
          scopes:
            catalogue:write: Maintain catalogue (administrators)
            orders:read: Read own orders
            orders:write: Place orders
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 30 }
        description: { type: string, maxLength: 3000 }
    CategoryCreate:
      type: object
      required: [name, description]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        description: { type: string, maxLength: 3000 }
    CategoryPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        page: { $ref: '#/components/schemas/PageMeta' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^\d+\.\d{2}$', description: Decimal as string to avoid floating-point errors }
        currency: { type: string, pattern: '^[A-Z]{3}$', examples: [USD] }
    Item:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string, format: uri }
        unitPrice: { $ref: '#/components/schemas/Money' }
        productId: { type: integer, format: int64 }
        productName: { type: string }
        categoryName: { type: string }
    ItemPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        page: { $ref: '#/components/schemas/PageMeta' }
    OrderLineCreate:
      type: object
      required: [itemId, quantity]
      properties:
        itemId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    Address:
      type: object
      required: [street1, city, postalCode, countryCode]
      properties:
        street1: { type: string, maxLength: 50 }
        street2: { type: string, maxLength: 50 }
        city: { type: string, maxLength: 50 }
        state: { type: string, maxLength: 50 }
        postalCode: { type: string, maxLength: 10 }
        countryCode: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2 }
    OrderCreate:
      type: object
      required: [lines, deliveryAddress, paymentToken]
      additionalProperties: false
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLineCreate' }
        deliveryAddress: { $ref: '#/components/schemas/Address' }
        paymentToken: { type: string, description: Opaque PSP token - never a card number }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64 }
        orderDate: { type: string, format: date-time }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, SHIPPED, CANCELLED] }
        lines:
          type: array
          items:
            type: object
            properties:
              itemId: { type: integer, format: int64 }
              itemName: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: '#/components/schemas/Money' }
              subTotal: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        vat: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        cardLast4: { type: string, pattern: '^\d{4}$' }
    OrderPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        page: { $ref: '#/components/schemas/PageMeta' }
