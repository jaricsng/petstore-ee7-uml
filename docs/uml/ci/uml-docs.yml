# Template GitHub Actions workflow - copy to .github/workflows/uml-docs.yml
# Purpose: keep UML diagrams in sync with code ("docs-as-code").
#  - verifies ALL docs (UML, architecture, UX, API, testing): syntax, Annex A headings, cross-references,
#    generated pages, links/anchors, OpenAPI validity
#  - re-renders SVG/PNG + Markdown pages and fails if committed copies are stale
name: uml-docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/main/java/**"
  push:
    branches: [main, master]
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  plantuml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Download PlantUML (pinned)
        run: |
          mkdir -p ~/.local/lib
          curl -fsSL -o ~/.local/lib/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2025.4/plantuml-1.2025.4.jar
          echo "PLANTUML_JAR=$HOME/.local/lib/plantuml.jar" >> "$GITHUB_ENV"
      - name: Install Python validators
        run: pip install openapi-spec-validator
      - name: Verify documentation
        run: ./docs/render.sh --check
      - name: Render and detect drift
        run: |
          ./docs/render.sh
          git diff --exit-code -- docs/*/rendered docs/uml/rendered docs/uml/markdown docs/testing/test-cases.* || {
            echo "::error::Rendered docs are stale. Run ./docs/render.sh and commit."; exit 1; }
