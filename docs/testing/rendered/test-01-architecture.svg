<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1282px" preserveAspectRatio="none" style="width:902px;height:1282px;background:#FFFFFF;" version="1.1" viewBox="0 0 902 1282" width="902px" zoomAndPan="magnify"><title>Test architecture - levels, tools and CI quality gates (target)</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="476.9434" x="205.748" y="22.9951">Test architecture - levels, tools and CI quality gates (target)</text></g><!--cluster ci--><g class="cluster" data-entity="ci" data-source-line="9" data-uid="ent0002" id="cluster_ci"><rect fill="none" height="970" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:1;" width="506" x="7" y="44.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="379.4766" x="70.2617" y="59.292">CI pipeline (GitHub Actions) - every pull request</text></g><!--cluster rel--><g class="cluster" data-entity="rel" data-source-line="18" data-uid="ent0010" id="cluster_rel"><rect fill="none" height="382" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:1;" width="354" x="537" y="894.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="154.9775" x="636.5112" y="909.292">Scheduled / release</text></g><!--entity g0--><g class="entity" data-entity="g0" data-source-line="10" data-uid="ent0003" id="entity_g0"><rect fill="#FFFFFF" height="85.1875" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="324.582" x="147.5" y="79.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="193.6758" x="157.5" y="102.292">Gate 0 - Pre-commit / static</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.5557" x="157.5" y="118.5889">Spotless format, gitleaks (secrets),</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.582" x="157.5" y="134.8857">SpotBugs + FindSecBugs (SAST), Semgrep,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.9434" x="157.5" y="151.1826">PlantUML + docs check (render.sh --check)</text></g><!--entity g1--><g class="entity" data-entity="g1" data-source-line="11" data-uid="ent0004" id="entity_g1"><rect fill="#E8F4EA" height="85.1875" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="332.8398" x="143.5" y="225.7969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.1221" x="153.5" y="248.792">Gate 1 - Unit tests (TC-UNIT)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.624" x="153.5" y="265.0889">JUnit 5, Mockito, AssertJ, EqualsVerifier</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.6279" x="153.5" y="281.3857">JaCoCo line &gt;= 80%, branch &gt;= 70%</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="312.8398" x="153.5" y="297.6826">PIT mutation score &gt;= 60% (model, service)</text></g><!--entity g2--><g class="entity" data-entity="g2" data-source-line="12" data-uid="ent0005" id="entity_g2"><rect fill="#EEF2FB" height="85.1875" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="474.7197" x="22.5" y="372.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="335.3438" x="32.5" y="395.292">Gate 2 - Architecture and governance (TC-GOV)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="368.9014" x="32.5" y="411.5889">ArchUnit layer rules, license-maven-plugin allow-list,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="454.7197" x="32.5" y="427.8857">CycloneDX SBOM, OWASP Dependency-Check (CVSS &gt;= 7 fails),</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="321.5557" x="32.5" y="444.1826">conftest/OPA on Dockerfile and K8s manifests</text></g><!--entity g3--><g class="entity" data-entity="g3" data-source-line="13" data-uid="ent0006" id="entity_g3"><rect fill="#E8F4EA" height="68.8906" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="425.6582" x="52" y="518.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.8896" x="62" y="541.292">Gate 3 - Integration (TC-INT)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="405.6582" x="62" y="557.5889">Arquillian + WildFly managed, Testcontainers PostgreSQL</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="337.0801" x="62" y="573.8857">JPA mappings, Bean Validation, EJB transactions</text></g><!--entity g4--><g class="entity" data-entity="g4" data-source-line="14" data-uid="ent0007" id="entity_g4"><rect fill="#E8F4EA" height="68.8906" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="322.1689" x="107" y="648.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.4863" x="117" y="671.292">Gate 4 - API contract (TC-API)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.1689" x="117" y="687.5889">REST Assured, OpenAPI schema validation,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.3389" x="117" y="703.8857">Schemathesis property-based fuzzing</text></g><!--entity g5--><g class="entity" data-entity="g5" data-source-line="15" data-uid="ent0008" id="entity_g5"><rect fill="#FFF8E1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="359.8896" x="89" y="778.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.377" x="99" y="801.292">Gate 5 - End-to-end UI (TC-E2E, TC-A11Y)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="339.8896" x="99" y="817.5889">Playwright for Java (Chromium, WebKit, Firefox),</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="313.209" x="99" y="833.8857">axe-core accessibility scan, visual snapshots</text></g><!--entity g6--><g class="entity" data-entity="g6" data-source-line="16" data-uid="ent0009" id="entity_g6"><rect fill="#FDECEC" height="68.8906" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="259.8799" x="140" y="929.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.8965" x="150" y="952.292">Gate 6 - DAST (TC-SEC)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="239.8799" x="150" y="968.5889">OWASP ZAP baseline on every PR,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="222.8447" x="150" y="984.8857">ZAP full scan + API scan nightly</text></g><!--entity perf--><g class="entity" data-entity="perf" data-source-line="19" data-uid="ent0011" id="entity_perf"><rect fill="#FFFFFF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="320.9316" x="553.5" y="929.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.2832" x="563.5" y="952.292">Performance (TC-PERF)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.9316" x="563.5" y="968.5889">Gatling: 50 users browse, 10 checkout/min</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="218.5107" x="563.5" y="984.8857">p95 &lt; 300 ms, error rate &lt; 1%</text></g><!--entity pen--><g class="entity" data-entity="pen" data-source-line="20" data-uid="ent0012" id="entity_pen"><rect fill="#FFFFFF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="313.0498" x="557.5" y="1061.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.6787" x="567.5" y="1084.292">Manual penetration test (TC-SEC-M)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.0498" x="567.5" y="1100.5889">OWASP WSTG v4.2 checklist, ASVS 5.0 L2</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="184.2627" x="567.5" y="1116.8857">before each major release</text></g><!--entity aud--><g class="entity" data-entity="aud" data-source-line="21" data-uid="ent0013" id="entity_aud"><rect fill="#FFFFFF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#2F5D8A;stroke-width:0.5;" width="316.29" x="556" y="1191.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="173.9951" x="566" y="1214.292">Audit evidence (TC-AUD)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="220.6641" x="566" y="1230.5889">test reports, SBOM, ZAP report,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.29" x="566" y="1246.8857">coverage, signed tag archived per release</text></g><g class="entity" data-entity="GMN23" data-source-line="35" data-uid="ent0024" id="entity_GMN23"><path d="M529,225.2969 L529,264.2969 L476.85,268.2969 L529,272.2969 L529,310.9609 A0,0 0 0 0 529,310.9609 L895.4395,310.9609 A0,0 0 0 0 895.4395,310.9609 L895.4395,235.2969 L885.4395,225.2969 L529,225.2969 A0,0 0 0 0 529,225.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M885.4395,225.2969 L885.4395,235.2969 L895.4395,235.2969 L885.4395,225.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="96.4336" x="535" y="242.3638">Test pyramid</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="186.5957" x="635.5659" y="242.3638">(Cohn): many fast unit tests,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="298.5493" x="535" y="257.4966">fewer integration and API tests, very few E2E.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="345.4395" x="535" y="272.6294">Current state: 9 unit classes (equals/hashCode only),</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="283.3403" x="535" y="287.7622">25 Arquillian IT classes (skipped by default:</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="327.1201" x="535" y="302.895">skipITs=true), 0 E2E, 0 security, no coverage tool.</text></g><!--link g0 to g1--><g class="link" data-entity-1="g0" data-entity-2="g1" data-source-line="24" data-uid="lnk14" id="link_g0_g1"><path d="M310,164.5969 C310,183.7669 310,200.4369 310,219.5969" fill="none" id="g0-to-g1" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="310,225.5969,314,216.5969,310,220.5969,306,216.5969,310,225.5969" style="stroke:#333333;stroke-width:1;"/></g><!--link g1 to g2--><g class="link" data-entity-1="g1" data-entity-2="g2" data-source-line="25" data-uid="lnk15" id="link_g1_g2"><path d="M295.54,311.0969 C288.9,330.2669 283.0221,347.2667 276.3921,366.4267" fill="none" id="g1-to-g2" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="274.43,372.0969,281.1532,364.8997,276.065,367.3718,273.593,3