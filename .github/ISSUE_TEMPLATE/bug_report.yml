name: Bug report
description: Report incorrect behaviour of the application or documentation.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Please do not report security vulnerabilities here. See SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or commit SHA"
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: WildFly version, JDK, browser, OS.
